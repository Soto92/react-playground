<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Three.js + Spark Playground</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.run/three",
          "three/examples/jsm/controls/OrbitControls": "https://esm.run/three/examples/jsm/controls/OrbitControls"
        }
      }
    </script>
  </head>

  <body>
    <header>
      <h1>Three.js + Spark quick playground</h1>
      <div class="header-note">
        Three.js (Standard) + Spark Effect (via Three.js Points)
      </div>
    </header>

    <main>
      <section class="panel">
        <strong>Three.js — rotating cube (solid earth)</strong>
        <canvas id="threeCanvas"></canvas>
        <div class="controls">
          <button id="resetCam">Reset camera</button>
          <button id="toggleSpin">Toggle spin</button>
        </div>
        <div class="log" id="threeLog"></div>
      </section>

      <section class="panel">
        <strong>SparkJS — splat mesh (Simulation with Points)</strong>
        <canvas id="sparkCanvas"></canvas>
        <div class="controls">
          <button id="reloadSpark">Reset Rotation</button>
          <a
            class="link"
            href="#"
            onclick="alert('Usando Three.js Points nativo para evitar erro 404')"
            >Spark docs (Substituído)</a
          >
        </div>
        <div class="log" id="sparkLog"></div>
      </section>
    </main>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";

      const EARTH_TEX =
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg";

      const threeCanvas = document.getElementById("threeCanvas");
      const threeRenderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        antialias: true,
      });

      threeRenderer.setSize(
        threeCanvas.clientWidth,
        threeCanvas.clientHeight,
        false
      );

      const threeScene = new THREE.Scene();
      const threeCamera = new THREE.PerspectiveCamera(
        60,
        threeCanvas.clientWidth / threeCanvas.clientHeight,
        0.1,
        100
      );
      threeCamera.position.set(0, 1, 3);

      const controls = new OrbitControls(threeCamera, threeCanvas);
      controls.update();

      const earthTexture = new THREE.TextureLoader().load(EARTH_TEX);
      const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
      const earthMaterial = new THREE.MeshStandardMaterial({
        map: earthTexture,
      });
      const earth = new THREE.Mesh(earthGeometry, earthMaterial);
      threeScene.add(earth);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(3, 4, 5);
      threeScene.add(light);

      let spinning = true;

      function loopThree() {
        if (
          threeCanvas.width !== threeCanvas.clientWidth ||
          threeCanvas.height !== threeCanvas.clientHeight
        ) {
          threeRenderer.setSize(
            threeCanvas.clientWidth,
            threeCanvas.clientHeight,
            false
          );
          threeCamera.aspect =
            threeCanvas.clientWidth / threeCanvas.clientHeight;
          threeCamera.updateProjectionMatrix();
        }

        if (spinning) earth.rotation.y += 0.002;
        threeRenderer.render(threeScene, threeCamera);
        requestAnimationFrame(loopThree);
      }
      loopThree();

      document.getElementById("toggleSpin").onclick = () => {
        spinning = !spinning;
      };

      document.getElementById("resetCam").onclick = () => {
        threeCamera.position.set(0, 1, 3);
        controls.update();
      };

      // SPARK

      const sparkCanvas = document.getElementById("sparkCanvas");
      const sparkRenderer = new THREE.WebGLRenderer({
        canvas: sparkCanvas,
        antialias: true,
      });
      sparkRenderer.setSize(
        sparkCanvas.clientWidth,
        sparkCanvas.clientHeight,
        false
      );

      const sparkScene = new THREE.Scene();
      const sparkCamera = new THREE.PerspectiveCamera(
        60,
        sparkCanvas.clientWidth / sparkCanvas.clientHeight,
        0.1,
        100
      );
      sparkCamera.position.set(0, 1, 3);

      const sparkControls = new OrbitControls(sparkCamera, sparkCanvas);

      const sparkGeometry = new THREE.SphereGeometry(1, 450, 450);
      const sparkMaterial = new THREE.PointsMaterial({
        size: 0.025,
        map: earthTexture,
        transparent: false,
        opacity: 1.0,
        sizeAttenuation: true,
        color: 0xffffff,
      });

      let sparkEarth = new THREE.Points(sparkGeometry, sparkMaterial);
      sparkEarth.scale.set(1.0, 1.0, 1.0);
      sparkScene.add(sparkEarth);

      function loopSpark() {
        if (
          sparkCanvas.width !== sparkCanvas.clientWidth ||
          sparkCanvas.height !== sparkCanvas.clientHeight
        ) {
          sparkRenderer.setSize(
            sparkCanvas.clientWidth,
            sparkCanvas.clientHeight,
            false
          );
          sparkCamera.aspect =
            sparkCanvas.clientWidth / sparkCanvas.clientHeight;
          sparkCamera.updateProjectionMatrix();
        }

        sparkEarth.rotation.y += 0.002;
        sparkRenderer.render(sparkScene, sparkCamera);
        requestAnimationFrame(loopSpark);
      }
      loopSpark();

      document.getElementById("reloadSpark").onclick = () => {
        sparkEarth.rotation.y = 0;
        sparkControls.reset();
      };
    </script>
  </body>
</html>
